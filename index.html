<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hybrid Log</title>

<style>
body {
  background:#050709;
  color:#e0eaf4;
  font-family: monospace;
  padding:20px;
}

.container {
  max-width:900px;
}

.card {
  background:#0e1318;
  padding:16px;
  border:1px solid #1c2530;
  margin-top:20px;
}

button {
  width:100%;
  padding:12px;
  margin:6px 0;
  border:none;
  background:#00e5ff;
  color:black;
  font-weight:bold;
  cursor:pointer;
}

h1 { letter-spacing:2px; }

h2 {
  color:#00e5ff;
  font-size:12px;
  letter-spacing:2px;
}
</style>

</head>

<body>

<div class="container">

<h1>HYBRID LOG ✅</h1>

<div class="card">
  <p>✅ System is working</p>
</div>

<div class="card">
  <h2>FITNESS COPILOT</h2>

  <button onclick="AI.run('coach')">Coach Review</button>
  <button onclick="AI.run('workout')">Generate Tomorrow</button>
  <button onclick="AI.run('nutrition')">Meals & Macros</button>
</div>

</div>

<script>

// ===============================
// STATE
// ===============================
let state = {
  streak: 5,
  sessions: []
};

// ===============================
// FITNESS COPILOT
// ===============================
const FIT = {
  computeReadiness() {
    let score = 100;

    if (state.streak > 7) score -= 15;

    if (state.sessions.length >= 5) score -= 10;

    return Math.max(50, score);
  }
};

// ===============================
// AI SYSTEM (GLOBAL)
// ===============================
window.AI = {
  run(type) {

    const readiness = FIT.computeReadiness();

    const prompt =
`You are an elite hybrid coach.

User:
- 45 years old
- 71kg
- Goal: muscle + fat loss
- VO2max: 48 → 52 target

Readiness: ${readiness}/100

Task:
${this.getTask(type)}
`;

    alert("✅ Copilot working — opening now");

    window.open("https://copilot.microsoft.com", "_blank");
  },

  getTask(type) {
    if (type === "coach") return "Review progress and give feedback + adjustments";
    if (type === "workout") return "Generate tomorrow workout under 60 min";
    if (type === "nutrition") return "Generate meals + macros";
    return "Help optimise training";
  }
};

console.log("✅ APP LOADED SUCCESSFULLY");

</script>

</body>
</html>
